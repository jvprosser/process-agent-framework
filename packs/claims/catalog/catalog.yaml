# Claims named catalog. sql: a file of one or more Impala statements.
# A label not listed here fails closed.
version: 1
database: car_insurance_claims
schema: car_insurance_claims

reads:
  get_claim_spine:
    required: [claim_id]
    optional: [database]
    summary: Claim spine for graph build
    sql: sql/get_claim_spine.sql
  get_claim_routing_signals:
    required: [claim_id]
    optional: [database]
    summary: Routing signals and insured-operator rows
    sql: sql/get_claim_routing_signals.sql
  get_litigation_view:
    required: [claim_id]
    optional: [database]
    summary: Litigation case business columns
    sql: sql/get_litigation_view.sql
  get_bi_view:
    required: [claim_id]
    optional: [database]
    summary: Injury business columns
    sql: sql/get_bi_view.sql
  get_subrogation_view:
    required: [claim_id]
    optional: [database]
    summary: Subrogation case business columns
    sql: sql/get_subrogation_view.sql
  get_pd_view:
    required: [claim_id]
    optional: [database]
    summary: Police, intake incident number, and fault
    sql: sql/get_pd_view.sql
  get_deny_view:
    required: [claim_id]
    optional: [database]
    summary: Operator, policy, and police facts for deny or citation review
    sql: sql/get_deny_view.sql
  get_schema:
    required: []
    optional: [database]
    summary: List tables
    sql: sql/get_schema.sql
  get_fnol_spine:
    required: [fnol_id]
    optional: [database]
    summary: FNOL notice spine (collision coverage, not every deductible)
    sql: sql/get_fnol_spine.sql
    shape: fnol_spine
  get_fnol_routing_signals:
    required: [fnol_id]
    optional: [database]
    summary: FNOL injury, third party, listed asset, peril, deductible
    sql: sql/get_fnol_routing_signals.sql
  get_claim_fact_assertions:
    required: [claim_id]
    optional: [database]
    summary: Latest asserted value for each case field
    sql: sql/get_claim_fact_assertions.sql
  list_adjuster_open_claims:
    required: [party_id]
    optional: [database]
    summary: Non-CLOSED claims currently assigned to an adjuster
    sql: sql/list_adjuster_open_claims.sql
    shape: adjuster_claims

writes:
  write_audit_event:
    required: [run_id, event_json]
    optional: [database]
    summary: Insert one audit event
    sql: sql/write_audit_event.sql
  append_agent_audit_event:
    required: [run_id, event_json]
    optional: [database]
    summary: Insert one audit event
    sql: sql/write_audit_event.sql
  append_agent_audit_evidence:
    required: [run_id, evidence_json]
    optional: [database]
    summary: Insert one audit evidence row
    sql: sql/append_agent_audit_evidence.sql
  begin_agent_audit_run:
    required: [run_id]
    optional: [database, source_branch]
    summary: Begin audit run (table-append mode)
    sql: sql/begin_agent_audit_run.sql
  promote_audit_run:
    required: [run_id]
    optional: [database]
    summary: Promote audit run
    sql: sql/promote_audit_run.sql
  promote_agent_audit_run:
    required: [run_id]
    optional: [database]
    summary: Promote audit run
    sql: sql/promote_audit_run.sql
  abandon_agent_audit_run:
    required: [run_id]
    optional: [database]
    summary: Delete audit rows for run_id
    sql: sql/abandon_agent_audit_run.sql
  create_litigation_task:
    required: [run_id, event_json]
    optional: [database]
    summary: Insert one litigation_task row
    sql: sql/create_litigation_task.sql
  create_pd_task:
    required: [run_id, event_json]
    optional: [database]
    summary: Insert one pd_task row and one audit receipt
    sql: sql/create_pd_task.sql
  deny_claim:
    required: [run_id, event_json]
    optional: [database]
    summary: Set claim_status_code DENIED
    sql: sql/deny_claim.sql
  deny_fnol:
    required: [run_id, event_json]
    optional: [database]
    summary: Set fnol.triage_status_code DENIED
    sql: sql/deny_fnol.sql
  close_fnol_incident_only:
    required: [run_id, event_json]
    optional: [database]
    summary: Set fnol.triage_status_code INCIDENT_ONLY
    sql: sql/close_fnol_incident_only.sql
  convert_fnol_to_claim:
    required: [run_id, event_json]
    optional: [database]
    summary: Insert claim 80000+fnol_id, insured and adjuster roles, optional reserve
    sql: sql/convert_fnol_to_claim.sql
  write_claim_fact_assertions:
    required: [run_id, claim_id, assertions_json]
    optional: [database]
    summary: Append one audit row per asserted case field
    sql: sql/write_claim_fact_assertions.sql
  review_fnol:
    required: [run_id, event_json]
    optional: [database]
    summary: Set fnol.triage_status_code ADJUSTER_REVIEW
    sql: sql/review_fnol.sql
